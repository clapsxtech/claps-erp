name: Deploy to Cloudflare

# Deploys the clapslearn-logs Worker (erp.clapslearn.in) and its Laravel
# container image whenever main changes, but only after the full test suite and
# security audits pass. Requires, in the GitHub environment CLOUDFLARE_API_TOKEN:
# - CLOUDFLARE_API_TOKEN (Workers Scripts, Containers, D1, R2 edit on the account
#   in public_html/wrangler.jsonc)
# Optional there: RESTART_TOKEN (stored on the Worker with each deploy, for manual
# restarts), and APP_KEY with INTERNAL_TOKEN (only when both are set do they replace
# the Worker's values).
#
# The app restarts itself on the new version: the Worker restarts its container on the
# first request after a version change (the 5-minute cron guarantees one). GitHub never
# calls the restart endpoint; Cloudflare security blocks GitHub's machines from it.
#
# D1 migrations are not applied here. The deploy stops if any file in
# public_html/cloudflare/migrations has not been applied to production yet;
# apply it with `npx wrangler d1 migrations apply clapslearn-erp --remote` first.
#
# If the new version does not become ready, the Worker is rolled back to the
# version that was live before this deploy, and the app restarts itself on it.
on:
  push:
    branches: [main]
    paths:
      - 'public_html/**'
      - '.github/workflows/cloudflare-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: cloudflare-deploy-production
  cancel-in-progress: false

jobs:
  # Runs without access to any deploy secret.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: public_html
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          # The production container image runs PHP 8.2.
          php-version: '8.2'
          extensions: bcmath, curl, dom, fileinfo, gd, mbstring, pdo_sqlite, xml, zip
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version-file: public_html/.nvmrc
          cache: npm
          cache-dependency-path: public_html/package-lock.json
      - name: Install locked dependencies
        run: |
          mkdir -p bootstrap/cache storage/framework/{cache/data,sessions,views} storage/logs
          composer install --no-interaction --prefer-dist
          composer check-platform-reqs
          npm ci
      - name: Security audits
        run: |
          composer audit
          npm audit --audit-level=high
      - name: PHP tests
        run: php vendor/bin/phpunit
      - name: PHP tests through the D1 adapter
        env:
          D1_COMPAT_TEST: '1'
        run: php vendor/bin/phpunit
      - name: Recovery drill
        run: php tests/Integration/erp-recovery-drill.php
      - name: Asset and deployment tests
        run: |
          npm test
          npx tsc --noEmit

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # CLOUDFLARE_API_TOKEN is a secret of this GitHub environment.
    environment: CLOUDFLARE_API_TOKEN
    defaults:
      run:
        working-directory: public_html
    steps:
      - uses: actions/checkout@v4
      - name: Check the Cloudflare token is available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set the GitHub secret CLOUDFLARE_API_TOKEN in the CLOUDFLARE_API_TOKEN environment before deploying. Nothing was deployed."
            exit 1
          fi
      # Secrets uploaded with the new version. Wrangler adds them to the Worker's existing
      # secrets and never removes omitted ones.
      # - RESTART_TOKEN (optional, for manual restarts): when set here, the Worker gets the
      #   same value with this deploy, so the GitHub secret is the only place to set it.
      # - APP_KEY and INTERNAL_TOKEN are normally already stored on the Worker; only when both
      #   are set here do they replace the stored ones.
      - name: Write Worker secrets file
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          RESTART_TOKEN: ${{ secrets.RESTART_TOKEN }}
        run: |
          umask 077
          node -e '
            const secrets = {};
            if (process.env.RESTART_TOKEN) secrets.RESTART_TOKEN = process.env.RESTART_TOKEN;
            if (process.env.APP_KEY && process.env.INTERNAL_TOKEN) Object.assign(secrets, { APP_KEY: process.env.APP_KEY, INTERNAL_TOKEN: process.env.INTERNAL_TOKEN });
            if (Object.keys(secrets).length) require("fs").writeFileSync(process.argv[1], JSON.stringify(secrets));
            console.log("Uploading with this deploy: " + (Object.keys(secrets).join(", ") || "nothing; using the secrets already stored on the Worker"));
          ' "$RUNNER_TEMP/worker-secrets.json"
          if [ -f "$RUNNER_TEMP/worker-secrets.json" ]; then
            echo "SECRETS_ARGS=--secrets-file $RUNNER_TEMP/worker-secrets.json" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: public_html/.nvmrc
          cache: npm
          cache-dependency-path: public_html/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      # New code can depend on new columns or tables, so it must not go live first.
      - name: Check every D1 migration is applied
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 migrations list clapslearn-erp --remote | tee "$RUNNER_TEMP/migrations.txt"
          if ! grep -q 'No migrations to apply' "$RUNNER_TEMP/migrations.txt"; then
            echo "::error::Some D1 migrations in public_html/cloudflare/migrations are not applied to production. Apply them with 'npx wrangler d1 migrations apply clapslearn-erp --remote', then rerun this deploy. Nothing was deployed."
            exit 1
          fi
      - name: Record the live version for rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler deployments list --json > "$RUNNER_TEMP/deployments.json"
          previous=$(node -e '
            const list = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const latest = [...list].sort((a, b) => Date.parse(b.created_on) - Date.parse(a.created_on))[0];
            const live = latest && (latest.versions || []).find(v => v.percentage === 100);
            if (live) process.stdout.write(live.version_id);
          ' "$RUNNER_TEMP/deployments.json")
          if [ -z "$previous" ]; then
            echo "::error::Could not find the version that is live now, so a failed deploy could not be rolled back. Nothing was deployed."
            exit 1
          fi
          echo "Live version before this deploy: $previous"
          echo "PREVIOUS_VERSION=$previous" >> "$GITHUB_ENV"
      - name: Build assets, push container image and deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # npm appends the arguments to the final `wrangler deploy` in cf:deploy.
        # The version is labelled with the commit and its subject line (Cloudflare keeps
        # messages to 100 characters), and tagged with the short commit for filtering.
        run: |
          subject=$(git log -1 --format=%s "$GITHUB_SHA" | tr -d '\r\n')
          message="${GITHUB_SHA::7} ${subject}"
          message="${message:0:100}"
          npm run cf:deploy -- $SECRETS_ARGS --tag "${GITHUB_SHA::7}" --message "$message"
      - name: Show active deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deployments status
      # The first request to the new version restarts the container on the new image, which
      # can take up to about two minutes, so retry for about four minutes per page.
      # Errors, timeouts and missing pages fail the deploy and roll it back. A 403 only
      # warns: Cloudflare's security settings can block GitHub's machines while the site is fine.
      - name: Check the live site
        run: |
          failed=""; blocked=""
          for path in /health /ready /parent/login; do
            for attempt in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -m 60 "https://erp.clapslearn.in$path" || true)
              echo "$path attempt $attempt: $code"
              [ "$code" = 200 ] && break
              [ "$attempt" -lt 12 ] && sleep 15
            done
            if [ "$code" = 403 ]; then blocked="$blocked $path"
            elif [ "$code" != 200 ]; then failed="$failed $path ($code)"; fi
          done
          if [ -n "$blocked" ]; then
            echo "::warning::Got 403 for:$blocked. Cloudflare security may be blocking GitHub's machines; check the site in a browser and Security > Events in Cloudflare."
          fi
          if [ -n "$failed" ]; then
            echo "::error::The live site failed after the deploy:$failed"
            exit 1
          fi
      - name: Roll back to the previous version
        if: failure() && steps.deploy.outcome != 'skipped'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # The container restarts itself onto the rolled-back version on its next request.
        run: |
          echo "::error::Deploy of ${GITHUB_SHA::7} failed; rolling back to version $PREVIOUS_VERSION."
          npx wrangler rollback "$PREVIOUS_VERSION" --message "Automatic rollback: ${GITHUB_SHA::7} did not become ready" --yes
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 180 https://erp.clapslearn.in/ready || true)
          echo "/ready after rollback: $code"
          [ "$code" = 200 ] || echo "::warning::Could not confirm the site after rolling back to $PREVIOUS_VERSION (HTTP $code). Check https://erp.clapslearn.in in a browser now."
