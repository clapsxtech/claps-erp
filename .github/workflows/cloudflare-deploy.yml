name: Deploy to Cloudflare

# Deploys the clapslearn-logs Worker (erp.clapslearn.in) and its Laravel
# container image whenever main changes. Requires the secret
# CLOUDFLARE_API_TOKEN in the GitHub environment of the same name (Workers
# Scripts, Containers, D1, R2 edit on the account in public_html/wrangler.jsonc).
# The Worker's own APP_KEY and INTERNAL_TOKEN must already be stored on it, or
# be set as GitHub secrets in that environment. D1 migrations are not applied here.
on:
  push:
    branches: [main]
    paths:
      - 'public_html/**'
      - '.github/workflows/cloudflare-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: cloudflare-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CLOUDFLARE_API_TOKEN is stored as a secret of this GitHub environment.
    environment: CLOUDFLARE_API_TOKEN
    defaults:
      run:
        working-directory: public_html
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare token is available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::GitHub secret CLOUDFLARE_API_TOKEN is not set in the CLOUDFLARE_API_TOKEN environment"
            exit 1
          fi
      # APP_KEY and INTERNAL_TOKEN are normally already stored on the Worker.
      # If both are also set as GitHub secrets here, they replace the stored ones.
      - name: Write Worker secrets file
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: |
          if [ -n "$APP_KEY" ] && [ -n "$INTERNAL_TOKEN" ]; then
            umask 077
            node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({APP_KEY: process.env.APP_KEY, INTERNAL_TOKEN: process.env.INTERNAL_TOKEN}))' "$RUNNER_TEMP/worker-secrets.json"
            echo "SECRETS_ARGS=--secrets-file $RUNNER_TEMP/worker-secrets.json" >> "$GITHUB_ENV"
          else
            echo "Using APP_KEY and INTERNAL_TOKEN already stored on the Worker."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: public_html/.nvmrc
          cache: npm
          cache-dependency-path: public_html/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Asset and deployment tests
        run: npm test
      - name: Build assets, push container image and deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # npm appends the arguments to the final `wrangler deploy` in cf:deploy.
        # The version is labelled with the commit and its subject line (Cloudflare keeps
        # messages to 100 characters), and tagged with the short commit for filtering.
        run: |
          subject=$(git log -1 --format=%s "$GITHUB_SHA" | tr -d '\r\n')
          message="${GITHUB_SHA::7} ${subject}"
          message="${message:0:100}"
          npm run cf:deploy -- $SECRETS_ARGS --tag "${GITHUB_SHA::7}" --message "$message"
      - name: Show active deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deployments status
      # A running container keeps the old code until it restarts. Restart it and
      # wait until the app reports ready (the endpoint allows up to 180 seconds).
      - name: Restart the app on the new version
        env:
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: |
          if [ -z "$INTERNAL_TOKEN" ]; then
            echo "::warning::INTERNAL_TOKEN is not set; restart the app manually to run the new version."
            exit 0
          fi
          curl -fsS -m 240 -X POST -H "Authorization: Bearer $INTERNAL_TOKEN" https://erp.clapslearn.in/__cloudflare/restart -o "$RUNNER_TEMP/restart.json"
          cat "$RUNNER_TEMP/restart.json"; echo
          grep -q '"ready":true' "$RUNNER_TEMP/restart.json"
      # Retries for about a minute per page while the new version settles. A page that
      # still fails is reported as a warning, not a failed run: Cloudflare's security
      # settings can block requests from GitHub's machines (403) while the site is fine.
      - name: Check the live site
        run: |
          failed=""
          for path in /health /ready /parent/login; do
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "https://erp.clapslearn.in$path" || true)
              echo "$path attempt $attempt: $code"
              [ "$code" = 200 ] && break
              [ "$attempt" -lt 6 ] && sleep 10
            done
            [ "$code" = 200 ] || failed="$failed $path ($code)"
          done
          if [ -n "$failed" ]; then
            echo "::warning::Live site check did not get 200 for:$failed. If it is 403, Cloudflare security may be blocking GitHub's machines; check the site in a browser and Security > Events in Cloudflare."
          fi
